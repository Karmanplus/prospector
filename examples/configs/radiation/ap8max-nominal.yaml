# AP8-MAX inner-proton belt (solar maximum), 212 um multi-layer coverglass, GaAs/Ge single-junction cell.
# At solar maximum the upper atmosphere expands and scrubs low-altitude trapped protons, so
# the AP8-MAX low-altitude proton flux runs ~6-7x BELOW AP8-MIN (AIAA G-083; the model that
# launches near solar max sees this gentler belt). Same band geometry as the worst case --
# only the proton core magnitude drops -- so selecting it moves the SSO total down, not sideways.
name: AP8-MAX nominal
cell: GaAs/Ge single-junction (NRL DDD)

re_km: 6371.0
proton_plateau_l: [1.6, 2.7]
proton_shoulder_l: 0.12
electron_peak_l: 4.5
electron_sigma_l: 0.9
bb0_scale: 2.0
belt_floor_lo_km: 1000.0
belt_floor_hi_km: 2500.0

# ~6.5x below AP8-MIN at low altitude (solar-max scrubbing); electron core as AP8-MIN.
proton_ddd_core: 7.1e8
electron_ddd_core: 5.8e6

cell_ddd_ref: 1.1e9
cell_ddd_coef: 0.2904

coverglass_um: 212.5
coverglass_density_g_cm3: 1.640
coverglass_ref_um: 75.0
coverglass_ref_density_g_cm3: 1.9866
proton_shield_exponent: 1.25
electron_shield_exponent: 0.3
